backend:
  name: github
  repo: stevenjose/3ro-primaria
  branch: main

media_folder: "assets"

collections:
  - name: "configuracion"
    label: "Gestión Escolar"
    delete: false
    editor:
      preview: false
    files:
      - name: "lista_examenes"
        label: "Exámenes y Combates"
        file: "examenes.json"
        description: "Gestiona los próximos exámenes y márcalos como pasados"
        fields:
          - label: "Lista de Exámenes"
            name: "examenes"
            widget: "list"
            fields:
              - label: "Fecha del Examen"
                name: "fecha"
                widget: "datetime"
                format: "DD MMM YYYY"
                date_format: "DD MMM YYYY"
                time_format: false
              - label: "Materia"
                name: "materia"
                widget: "select"
                options: ["Matemáticas", "Inglés", "Medi", "Lengua"]
              - label: "Título del Examen"
                name: "titulo"
                widget: "string"
              - label: "Color de Tinta"
                name: "color"
                widget: "string"
                default: "#00f3ff"
              - label: "Estado"
                name: "estado"
                widget: "select"
                options: ["proximo", "pasado"]
                default: "proximo"
              - label: "Enlace Google Calendar"
                name: "fechaCompleta"
                widget: "string"
                required: false